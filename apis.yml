name: Page
description: >-
  Page is an AI-powered government relations (GR) platform that tracks
  legislation, regulatory activity, and policy developments across 70+
  jurisdictions in real time. It provides bill tracking, regulatory affairs
  monitoring, live hearing and vote alerts, lobbying and parliamentary questions
  data, smart alerts, AI analysis of policy trends, and detailed politician and
  staff directories, alongside Wonk — an AI assistant for policy research and
  document generation. Page serves enterprises, multi-client firms, law firms,
  government agencies, associations, and nonprofits. It is headquartered in
  Washington, DC with an additional office in Waterloo, Ontario, and is backed by
  Canaan Partners. Page holds SOC 2 Type II certification. As of this profile
  Page exposes no public developer API.
